<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sokury - 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --font: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f1f6; --border: #e3e5ec;
    --text: #1c1e26; --text-dim: #6b6f80; --text-faint: #9a9db0;
    --accent: #6C5CFC; --accent-soft: #ecebff; --danger: #e03131;
    --radius: 14px; --shadow: 0 8px 24px rgba(20,20,40,0.08); --shadow-lg: 0 20px 60px rgba(10,10,30,0.28);
    --cat-regular:#7C5CFC; --cat-ep:#12B886; --cat-single:#228BE6; --cat-mixtape:#F59F00;
    --cat-compilation:#E64980; --cat-physical:#495057; --cat-concert:#E03131;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14151c; --surface:#1c1e28; --surface-2:#23252f; --border:#31333f;
      --text:#f0f1f6; --text-dim:#a7abc0; --text-faint:#6b6f80;
      --accent-soft:#2b2650; --shadow:0 8px 24px rgba(0,0,0,0.4); --shadow-lg:0 20px 60px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14151c; --surface:#1c1e28; --surface-2:#23252f; --border:#31333f;
    --text:#f0f1f6; --text-dim:#a7abc0; --text-faint:#6b6f80;
    --accent-soft:#2b2650; --shadow:0 8px 24px rgba(0,0,0,0.4); --shadow-lg:0 20px 60px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--font);cursor:pointer;}
  input,select,textarea{font-family:var(--font);}

  #topbar{
    display:flex;align-items:center;justify-content:space-between;padding:14px 24px;
    background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:10px;
  }
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .admin-nav{display:flex;gap:4px;margin-left:10px;}
  .admin-nav a{padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--text-dim);text-decoration:none;transition:background .15s,color .15s;}
  .admin-nav a:hover{background:var(--accent-soft);color:var(--accent);}
  #auth-area{display:flex;align-items:center;gap:8px;}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text);}
  .user-chip .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .user-chip .name{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .logout-btn{background:none;border:none;color:var(--text-faint);font-size:12px;cursor:pointer;font-family:var(--font);padding:4px;}
  .logout-btn:hover{color:var(--danger);}
  .login-btn{display:inline-block;padding:8px 16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;text-decoration:none;}
  .pw-note{font-size:12px;color:var(--text-faint);}
  @media (max-width:520px){ .user-chip .name{display:none;} .admin-nav{margin-left:0;} }
  .site-title{font-weight:900;font-size:20px;letter-spacing:-0.5px;color:var(--accent);}
  .badge-admin{font-size:11px;font-weight:800;color:#fff;background:var(--accent);padding:3px 10px;border-radius:999px;}
  .topbar-right{font-size:12px;color:var(--text-faint);}

  #app{max-width:1100px;margin:0 auto;padding:24px 16px 60px;}

  .mock-banner{
    background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;
    margin-bottom:18px;text-align:center;
  }

  .admin-gate{max-width:340px;margin:60px auto;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px 24px;box-shadow:var(--shadow);}
  .admin-gate h2{margin:0 0 16px;font-size:18px;}
  .admin-gate input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-size:14px;margin-bottom:12px;color:var(--text);}
  .admin-gate button{width:100%;padding:11px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:800;}
  .admin-gate .hint{font-size:11px;color:var(--text-faint);margin-top:14px;line-height:1.5;}

  .admin-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .admin-tabs{display:flex;gap:6px;}
  .admin-tab-btn{padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:13px;color:var(--text-dim);}
  .admin-tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .admin-logout{font-size:12px;color:var(--text-faint);}
  .admin-logout:hover{color:var(--danger);}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
  .stat-card .num{font-size:22px;font-weight:900;}
  .stat-card .label{font-size:12px;color:var(--text-faint);font-weight:600;margin-top:2px;}

  .admin-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .add-btn{padding:10px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:800;font-size:13px;}
  .add-btn:hover{opacity:.9;}
  .status-filter select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);font-size:12px;color:var(--text);}

  .data-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);overflow-x:auto;}
  table.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
  table.data-table th{text-align:left;padding:11px 12px;background:var(--surface-2);color:var(--text-faint);font-size:11px;font-weight:800;border-bottom:1px solid var(--border);white-space:nowrap;}
  table.data-table td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.data-table tr:last-child td{border-bottom:none;}
  table.data-table tr.clickable{cursor:pointer;}
  table.data-table tr.clickable:hover{background:var(--surface-2);}
  .table-cat-tag{display:inline-block;color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;}
  .status-badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;}
  .status-badge.pending{background:#fff3bf;color:#997404;}
  .status-badge.uploaded{background:#d3f9d8;color:#2b8a3e;}
  .status-badge.rejected{background:#ffe3e3;color:#c92a2a;}
  .handled-note{font-size:12px;color:var(--text-faint);margin-right:auto;align-self:center;}
  .row-actions{display:flex;gap:6px;}
  .row-actions button{padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);font-size:11px;font-weight:700;color:var(--text-dim);}
  .row-actions button:hover{border-color:var(--accent);color:var(--accent);}
  .row-actions button.del:hover{border-color:var(--danger);color:var(--danger);}
  .empty-table{padding:40px 16px;text-align:center;color:var(--text-faint);font-size:13px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(10,10,20,0.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
  .modal-box{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:380px;padding:24px;position:relative;max-height:88vh;overflow:auto;}
  .modal-box.wide{max-width:520px;}
  .modal-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text-dim);font-size:14px;display:flex;align-items:center;justify-content:center;}
  .modal-close:hover{background:var(--accent-soft);color:var(--accent);}
  .modal-tag{display:inline-block;color:#fff;font-size:12px;font-weight:800;padding:4px 12px;border-radius:999px;margin-bottom:16px;}
  .modal-rows{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
  .modal-row .modal-label{font-size:11px;color:var(--text-faint);font-weight:700;margin-bottom:2px;display:block;}
  .modal-row .modal-value{font-size:16px;font-weight:700;color:var(--text);}
  .modal-row .modal-value.small{font-size:13px;font-weight:500;color:var(--text-dim);}
  .modal-form-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:18px;}
  .modal-form-actions{display:flex;gap:8px;justify-content:flex-end;}
  .btn-primary{padding:10px 18px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:800;font-size:13px;}
  .btn-ghost{padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-weight:700;font-size:13px;}
  .btn-danger{padding:10px 18px;border-radius:10px;border:none;background:var(--danger);color:#fff;font-weight:800;font-size:13px;}
  .field{margin-bottom:0;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text);}
  .field input, .field select, .field textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:14px;}
  .field textarea{resize:vertical;min-height:70px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent);}
  .date-group{display:flex;gap:8px;}
  .date-group input{
    width:100%;padding:11px 10px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);font-size:14px;text-align:center;
  }
  .date-group input:focus{outline:none;border-color:var(--accent);}
  .date-group .y{flex:1.4;}
  .date-group .m{flex:1;}
  .date-group .d{flex:1;}
  .date-group-label{font-size:11px;color:var(--text-faint);margin-top:4px;display:flex;gap:8px;}
  .date-group-label span{flex:1.4;text-align:center;}
  .date-group-label span:nth-child(2), .date-group-label span:nth-child(3){flex:1;}

  #toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{background:#1c1e28;color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);animation:toastin .2s ease;}
  @keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  /* ---- 아티스트 여러 명 + 자동완성 ---- */
  .artist-fields{display:flex;flex-direction:column;gap:12px;}
  .artist-fields .field{margin-bottom:0;}
  .ac-wrap{position:relative;}
  .ac-wrap .artist-input{padding-right:40px;}
  .artist-remove{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;
    background:var(--surface);color:var(--text-faint);cursor:pointer;font-size:12px;}
  .artist-remove:hover{color:var(--danger);}
  .artist-add{align-self:flex-start;background:none;border:1px dashed var(--border);border-radius:999px;padding:6px 14px;color:var(--accent);
    font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font);}
  .artist-add:hover{border-color:var(--accent);background:var(--accent-soft);}
  .ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-lg);display:none;max-height:240px;overflow-y:auto;}
  .ac-list.show{display:block;}
  .ac-item{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--text);}
  .ac-item small{font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ac-item.active,.ac-item:hover{background:var(--accent-soft);color:var(--accent);}
  .ac-kind{font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--accent);border-radius:999px;padding:1px 7px;}
  /* ---- 엑셀식 열 필터 ---- */
  .th-filter{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-weight:800;}
  .th-filter:hover{color:var(--accent);}
  .th-filter.on{color:var(--accent);}
  .th-caret{font-size:10px;opacity:.8;}
  .col-filter{position:absolute;z-index:300;width:250px;background:var(--surface);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow-lg);padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13px;}
  .cf-sort{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--border);padding-bottom:8px;}
  .cf-sort button{text-align:left;background:none;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--text);font-family:var(--font);font-size:13px;}
  .cf-sort button:hover{background:var(--accent-soft);color:var(--accent);}
  .cf-search{padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:var(--font);font-size:13px;}
  .cf-list{max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:4px;}
  .cf-item{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;color:var(--text);}
  .cf-item:hover{background:var(--surface-2);}
  .cf-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cf-item small{color:var(--text-faint);font-size:11px;}
  .cf-item input{accent-color:var(--accent);margin:0;}
  .cf-all{font-weight:700;border-bottom:1px solid var(--border);border-radius:0;margin-bottom:2px;}
  .cf-empty{padding:12px;text-align:center;color:var(--text-faint);}
  .cf-actions{display:flex;justify-content:flex-end;gap:6px;}
  .cf-actions button{padding:7px 12px;font-size:12px;}
  .filter-note{font-size:12px;color:var(--accent);font-weight:700;margin:0 0 8px;}
  .filter-note button{background:none;border:none;color:var(--text-faint);text-decoration:underline;cursor:pointer;font-family:var(--font);font-size:12px;}

  /* ---- 일정 보기 선택 ---- */
  .view-picker{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .view-picker select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text);font-family:var(--font);font-weight:700;}
  .view-step{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text);font-size:14px;}
  .view-step:hover{border-color:var(--accent);color:var(--accent);}
  .view-label{font-size:12px;color:var(--text-faint);font-weight:700;margin-left:6px;}
  .carry{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 7px;}
  .sep{color:var(--text-faint);}
  .muted{color:var(--text-faint);font-size:12px;}

  /* ---- 이름 관리 ---- */
  .group-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;min-width:0;}
  .group-bar-label{font-size:12px;font-weight:800;color:var(--text-faint);margin-right:4px;}
  .kind-badge{display:inline-block;font-size:10px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
  .kind-badge.grp{background:var(--accent);color:#fff;border-color:var(--accent);}
  .member-list{font-size:12px;color:var(--text-dim);}
  .note-text{white-space:pre-wrap;word-break:break-word;}
  .grp-chip{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px;cursor:pointer;border:none;font-family:var(--font);margin:1px 0;}
  .grp-chip.big{font-size:12px;padding:5px 12px;}
  .grp-chip small{font-weight:600;opacity:.75;font-size:10px;}
  .grp-chip:hover{background:var(--accent);color:#fff;}
  .acts-cell{min-width:280px;}
  .acts{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
  .act{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 9px;
    font-size:12px;color:var(--text);cursor:pointer;font-family:var(--font);text-align:left;}
  .act:hover{border-color:var(--accent);color:var(--accent);}
  .act .dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}
  .act small{color:var(--text-faint);}
  .form-hint{font-size:12px;color:var(--text-faint);line-height:1.6;margin:0;}
  .grp-checks{display:flex;flex-wrap:wrap;gap:8px;}
  .grp-check{display:flex;align-items:center;gap:4px;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:999px;cursor:pointer;}
  .grp-check small{color:var(--text-faint);font-size:10px;}
  .grp-check input{accent-color:var(--accent);margin:0;}
  /* ---- 카테고리별 날짜 입력 ---- */
  .when-box{display:flex;flex-direction:column;gap:0;}
  .when-box > .field, .range-block .field{margin-bottom:12px;}
  .time-group{display:flex;align-items:center;gap:8px;max-width:220px;}
  .time-group input{text-align:center;}
  .time-group span{font-weight:900;color:var(--text-faint);}
  .range-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .range-block{border:1px solid var(--border);border-radius:12px;padding:12px 12px 0;background:var(--surface);}
  .when-box > .range-block{border:none;padding:0;background:none;}
  .range-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;}
  .range-remove{width:24px;height:24px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text-faint);cursor:pointer;font-size:11px;}
  .range-remove:hover{color:var(--danger);}
  .when-check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim);font-weight:600;cursor:pointer;user-select:none;margin:-4px 0 12px;}
  .when-check input{accent-color:var(--accent);margin:0;width:auto;}
</style>
</head>
<body>

<div id="topbar">
  <div class="topbar-left">
    <span class="site-title">Sokury</span>
    <span class="badge-admin">ADMIN</span>
    <nav class="admin-nav"><a href="/">캘린더</a></nav>
  </div>
  <div class="topbar-right" id="auth-area"></div>
</div>

<main id="app"></main>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* =========================================================
   카테고리 정의 (메인 사이트와 동일)
========================================================= */
const CATEGORIES = {
  regular:     { label:'정규',      color:'var(--cat-regular)' },
  ep:          { label:'EP',        color:'var(--cat-ep)' },
  single:      { label:'싱글',      color:'var(--cat-single)' },
  mixtape:     { label:'믹스테입',  color:'var(--cat-mixtape)' },
  compilation: { label:'컴필레이션',color:'var(--cat-compilation)' },
  concert:     { label:'콘서트',    color:'var(--cat-concert)' },
  physical:    { label:'피지컬',    color:'var(--cat-physical)' },
};
const ALL_CATS = Object.keys(CATEGORIES);

/* =========================================================
   API 클라이언트 — 이 페이지는 서버의 requireAdminBasicAuth(middleware.js)를
   통과해야만 내려받아지므로, 여기서 보내는 쓰기 요청(/api/... POST/PUT/PATCH/DELETE)도
   브라우저가 같은 인증을 자동으로 함께 보냅니다.
========================================================= */
async function apiCall(query, options){
  const r = await fetch('/api/data?' + query, options);
  let data = null;
  try{ data = await r.json(); }catch(e){}
  if(!r.ok){ const err = new Error((data && data.error) || ('서버 오류 (' + r.status + ')')); err.data = data; throw err; }
  return data;
}
const JSON_HEADERS = {'Content-Type':'application/json'};
const Api = {
  listSchedules(){ return apiCall('resource=schedules'); },
  createSchedule(p){ return apiCall('resource=schedules', {method:'POST', headers:JSON_HEADERS, body:JSON.stringify(p)}); },
  updateSchedule(id, p){ return apiCall('resource=schedules&id='+encodeURIComponent(id), {method:'PUT', headers:JSON_HEADERS, body:JSON.stringify(p)}); },
  deleteSchedule(id){ return apiCall('resource=schedules&id='+encodeURIComponent(id), {method:'DELETE'}); },
  listApplications(){ return apiCall('resource=applications'); },
  patchApplication(id, p){ return apiCall('resource=applications&id='+encodeURIComponent(id), {method:'PATCH', headers:JSON_HEADERS, body:JSON.stringify(p)}); },
  deleteApplication(id){ return apiCall('resource=applications&id='+encodeURIComponent(id), {method:'DELETE'}); },
};

let scheduleCache = [];

async function refreshCaches(){
  [scheduleCache, applicationCache] = await Promise.all([Api.listSchedules(), Api.listApplications(), loadArtistDb()]);
}

function fmtDateKR(iso){ const [y,m,d] = iso.split('-').map(Number); return `${y}년 ${m}월 ${d}일`; }
function fmtDateRangeKR(start, end){ if(!end || start===end) return fmtDateKR(start); return `${fmtDateKR(start)} ~ ${fmtDateKR(end)}`; }
function fmtDateISO(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function eachDateInRange(start, end){
  const [sy,sm,sd] = start.split('-').map(Number);
  const [ey,em,ed] = end.split('-').map(Number);
  let cur = new Date(sy, sm-1, sd);
  const last = new Date(ey, em-1, ed);
  const dates = [];
  let guard = 0;
  while(cur <= last && guard < 366){
    dates.push(fmtDateISO(cur));
    cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate()+1);
    guard++;
  }
  return dates;
}
function dateRangeFieldsHtml(startDate, endDate){

  const [ey,em,ed] = endDate ? endDate.split('-') : ['','',''];

      <label>시작일</label>
      <div class="date-group">
        <input class="y" type="text" inputmode="numeric" maxlength="4" placeholder="YYYY" id="start-y" value="${sy}" autocomplete="off">
        <input class="m" type="text" inputmode="numeric" maxlength="2" placeholder="MM" id="start-m" value="${sm}" autocomplete="off">
        <input class="d" type="text" inputmode="numeric" maxlength="2" placeholder="DD" id="start-d" value="${sd}" autocomplete="off">
      </div>

    </div>
    <div class="field">
      <label>종료일</label>
      <div class="date-group">
        <input class="y" type="text" inputmode="numeric" maxlength="4" placeholder="YYYY" id="end-y" value="${ey}" autocomplete="off">
        <input class="m" type="text" inputmode="numeric" maxlength="2" placeholder="MM" id="end-m" value="${em}" autocomplete="off">
        <input class="d" type="text" inputmode="numeric" maxlength="2" placeholder="DD" id="end-d" value="${ed}" autocomplete="off">
      </div>
      <div class="date-group-label"><span>년</span><span>월</span><span>일</span></div>
    </div>`;
}
function clampDigits(el, maxLen, maxVal){
  el.addEventListener('input', ()=>{
    let v = el.value.replace(/[^0-9]/g,'').slice(0, maxLen);
    if(v.length === maxLen && maxVal){
      const n = parseInt(v, 10);
      if(n > maxVal) v = String(maxVal);
      if(n === 0) v = '01'.slice(0, maxLen);
    }
    el.value = v;
  });
}

function bindVenueToggle(selectId, wrapId){
  const sel = document.getElementById(selectId), wrap = document.getElementById(wrapId);
  if(!sel || !wrap) return;
  const sync = ()=>{ wrap.style.display = sel.value==='concert' ? '' : 'none'; };
  sel.onchange = sync;
  sync();
}
function setupDateRangeInputs(){
  const sy=document.getElementById('start-y'), sm=document.getElementById('start-m'), sd=document.getElementById('start-d');
  const ey=document.getElementById('end-y'), em=document.getElementById('end-m'), ed=document.getElementById('end-d');
  if(!sy) return;
  clampDigits(sy, 4, null);
  clampDigits(sm, 2, 12);
  clampDigits(sd, 2, 31);
  clampDigits(ey, 4, null);
  clampDigits(em, 2, 12);
  clampDigits(ed, 2, 31);
  [sy, sm, sd].forEach(el=>{
    el.addEventListener('input', ()=>{
      ey.value = sy.value; em.value = sm.value; ed.value = sd.value;
    });
  });
}
function readDateGroup(prefix){
  const y = document.getElementById(prefix+'-y').value;
  const m = document.getElementById(prefix+'-m').value;
  const d = document.getElementById(prefix+'-d').value;
  if(y.length!==4 || !m || !d) return null;
  const mm = String(Math.min(12, Math.max(1, parseInt(m,10)||1))).padStart(2,'0');
  const dd = String(Math.min(31, Math.max(1, parseInt(d,10)||1))).padStart(2,'0');
  return `${y}-${mm}-${dd}`;
}
function escapeHtml(str){ return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  root.appendChild(el); setTimeout(()=>el.remove(), 2400);
}

function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function openModal(innerHtml, opts){
  opts = opts||{};
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box ${opts.wide?'wide':''}">
        <button class="modal-close" onclick="closeModal()">✕</button>
        ${innerHtml}
      </div>
    </div>`;
  document.getElementById('modal-overlay').addEventListener('mousedown', function(e){ if(e.target.id==='modal-overlay') closeModal(); });
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

function openScheduleForm(id){
  const s = id ? scheduleCache.find(x=>x.id===id) : null;
  openModal(`
    <div class="modal-tag" style="background:var(--accent)">${s?'일정 수정':'새 일정 추가'}</div>
    <div class="modal-form-grid">${scheduleFormHtml('f', s || {})}</div>
    <div class="modal-form-actions">
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-primary" id="schedule-save-btn" onclick="saveScheduleForm(${s?`'${s.id}'`:'null'})">저장</button>
    </div>
  `, {wide:true});
  bindScheduleForm('f');
}
async function saveScheduleForm(id){
  const r = readScheduleForm('f');
  if(r.error){ showToast(r.error); return; }
  const btn = document.getElementById('schedule-save-btn');
  if(btn) btn.disabled = true;
  try{
    if(id){ await Api.updateSchedule(id, r.data); showToast('일정이 수정되었습니다.'); }
    else{ await Api.createSchedule(r.data); showToast('일정이 추가되었습니다.'); }
    await refreshCaches();
    closeModal();
    renderBody();
  }catch(e){
    showToast('저장 실패: ' + e.message);
    if(btn) btn.disabled = false;
  }
}
function confirmDeleteSchedule(id){
  openModal(`
    <div class="modal-tag" style="background:var(--danger)">일정 삭제</div>
    <div class="modal-rows"><div class="modal-row"><span class="modal-value small">이 일정을 삭제하시겠습니까? 되돌릴 수 없습니다.</span></div></div>
    <div class="modal-form-actions">
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-danger" onclick="doDeleteSchedule('${id}')">삭제</button>
    </div>`);
}
async function doDeleteSchedule(id){
  try{
    await Api.deleteSchedule(id);
    await refreshCaches();
    closeModal(); renderBody();
    showToast('삭제되었습니다.');
  }catch(e){
    showToast('삭제 실패: ' + e.message);
  }
}

function openUploadFromApplication(appId){
  const a = applicationCache.find(x=>x.id===appId);
  if(!a) return;
  if(a.status !== 'pending'){ showToast('이미 처리된 신청이에요.'); return; }
  openModal(`
    <div class="modal-tag" style="background:var(--accent)">일정으로 업로드</div>
    <div class="modal-form-grid">${scheduleFormHtml('f', { ...a, title: a.name })}</div>
    <div class="modal-form-actions">
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-primary" id="upload-btn" onclick="confirmUploadApplication('${appId}')">캘린더에 업로드</button>
    </div>
  `, {wide:true});
  bindScheduleForm('f');
}
async function confirmUploadApplication(appId){
  const r = readScheduleForm('f');
  if(r.error){ showToast(r.error); return; }
  const btn = document.getElementById('upload-btn');
  if(btn) btn.disabled = true;
  try{
    await Api.patchApplication(appId, {status:'uploaded'});
    try{
      await Api.createSchedule(r.data);
    }catch(e){
      await Api.patchApplication(appId, {status:'pending'}).catch(()=>{});
      throw e;
    }
    await refreshCaches();
    showToast('캘린더에 업로드되었습니다.');
    closeModal(); render();
  }catch(e){
    showToast('업로드 실패: ' + e.message);
    await refreshCaches().catch(()=>{});
    if(btn) btn.disabled = false;
  }
}

/* =========================================================
   아티스트 여러 명 입력 + 자동완성
========================================================= */
let knownArtists = [];   // [{ name, groups:[groupId] }]
let knownGroups = [];    // [{ id, name, kind }]
async function loadArtistDb(){
  try{ const d = await apiCall('resource=artists'); knownArtists = d.artists || []; knownGroups = d.groups || []; }catch(e){}
}
function groupNamesOf(name){
  const a = knownArtists.find(x=>x.name===name);
  return a ? (a.groups||[]).map(id=>(knownGroups.find(g=>g.id===id)||{}).name).filter(Boolean) : [];
}
function artistRowHtml(i, val){
  return `<div class="field artist-row"><label>아티스트 ${i+1}</label>
    <div class="ac-wrap"><input type="text" class="artist-input" value="${escapeHtml(val||'')}" autocomplete="off" spellcheck="false">
      ${i>0 ? `<button type="button" class="artist-remove" title="빼기" onclick="removeArtistRow(this)">✕</button>` : ''}
      <div class="ac-list"></div></div></div>`;
}
function artistFieldsHtml(prefix, names, opts){
  const list = names && names.length ? names : [''];
  return `<div class="artist-fields" id="${prefix}-artists" ${opts && opts.noGroups ? 'data-no-groups="1"' : ''}>
    ${list.map((n,i)=>artistRowHtml(i, n)).join('')}
    <button type="button" class="artist-add" onclick="addArtistRow('${prefix}')">+ 아티스트 추가</button>
  </div>`;
}
function relabelArtistRows(box){
  box.querySelectorAll('.artist-row').forEach((row,i)=>{ row.querySelector('label').textContent = `아티스트 ${i+1}`; });
}
function addArtistRow(prefix){
  const box = document.getElementById(prefix+'-artists');
  const n = box.querySelectorAll('.artist-row').length;
  box.querySelector('.artist-add').insertAdjacentHTML('beforebegin', artistRowHtml(n, ''));
  const rows = box.querySelectorAll('.artist-row');
  rows[rows.length-1].querySelector('input').focus();
}
function removeArtistRow(btn){
  const box = btn.closest('.artist-fields');
  btn.closest('.artist-row').remove();
  relabelArtistRows(box);
}
function readArtistFields(prefix){
  const out = [];
  document.querySelectorAll(`#${prefix}-artists .artist-input`).forEach(el=>{
    const v = el.value.replace(/\s+/g,' ').trim();
    if(v && !out.includes(v)) out.push(v);
  });
  return out;
}
// 자동완성: 입력하는 글자가 들어간 기존 아티스트를 바로 아래에 보여줌
function acSuggest(input){
  const list = input.parentElement.querySelector('.ac-list');
  const q = input.value.trim().toLowerCase();
  if(!q){ list.classList.remove('show'); list.innerHTML=''; return; }
  const box = input.closest('.artist-fields');
  const taken = box ? Array.from(box.querySelectorAll('.artist-input')).filter(x=>x!==input).map(x=>x.value.trim()) : [];
  // 아티스트 + (멤버 입력칸이 아니면) 그룹·레이블 이름도 후보로
  const pool = knownArtists.map(a=>({ name:a.name, sub:groupNamesOf(a.name).join(', '), group:false }));
  if(!(box && box.dataset.noGroups)) knownGroups.forEach(g=>{ if(!pool.some(x=>x.name===g.name)) pool.push({ name:g.name, sub:g.kind, group:true }); });
  const hits = pool
    .filter(x=> x.name.toLowerCase().includes(q) && !taken.includes(x.name))
    .sort((a,b)=> (b.name.toLowerCase().startsWith(q)) - (a.name.toLowerCase().startsWith(q)) || a.name.localeCompare(b.name,'ko'))
    .slice(0, 8);
  if(!hits.length || (hits.length===1 && hits[0].name===input.value.trim())){ list.classList.remove('show'); list.innerHTML=''; return; }
  list.innerHTML = hits.map((x,i)=>
    `<div class="ac-item ${i===0?'active':''}" data-name="${escapeHtml(x.name)}"><span>${escapeHtml(x.name)}</span>${x.group?`<em class="ac-kind">${escapeHtml(x.sub)}</em>`:(x.sub?`<small>${escapeHtml(x.sub)}</small>`:'')}</div>`
  ).join('');
  list.classList.add('show');
}
function acPick(input, name){
  input.value = name;
  const list = input.parentElement.querySelector('.ac-list');
  list.classList.remove('show'); list.innerHTML='';
}
document.addEventListener('input', e=>{ if(e.target.classList && e.target.classList.contains('artist-input')) acSuggest(e.target); });
document.addEventListener('focusin', e=>{ if(e.target.classList && e.target.classList.contains('artist-input')) acSuggest(e.target); });
document.addEventListener('focusout', e=>{
  if(e.target.classList && e.target.classList.contains('artist-input')){
    const list = e.target.parentElement.querySelector('.ac-list');
    setTimeout(()=>{ list.classList.remove('show'); }, 150);
  }
});
document.addEventListener('mousedown', e=>{
  const item = e.target.closest && e.target.closest('.ac-item');
  if(!item) return;
  e.preventDefault();
  acPick(item.closest('.ac-wrap').querySelector('.artist-input'), item.getAttribute('data-name'));
});
document.addEventListener('keydown', e=>{
  if(!(e.target.classList && e.target.classList.contains('artist-input'))) return;
  const list = e.target.parentElement.querySelector('.ac-list');
  if(!list.classList.contains('show')) return;
  const items = Array.from(list.querySelectorAll('.ac-item'));
  let i = items.findIndex(x=>x.classList.contains('active'));
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    e.preventDefault();
    if(i>-1) items[i].classList.remove('active');
    i = e.key==='ArrowDown' ? (i+1)%items.length : (i-1+items.length)%items.length;
    items[i].classList.add('active');
  } else if(e.key==='Enter' && i>-1){
    e.preventDefault(); acPick(e.target, items[i].getAttribute('data-name'));
  } else if(e.key==='Escape'){
    list.classList.remove('show');
  }
});

/* =========================================================
   엑셀식 열 필터 (모든 표 공통)
========================================================= */
const tableState = {};   // 표별 { filters:{열: Set}, sort:{col,dir} }
const tableCtx = {};     // 표별 { cols, rows, rerender }
function tState(key){ return tableState[key] || (tableState[key] = { filters:{}, sort:null }); }
function colValues(c, r){
  const v = c.values ? c.values(r) : [c.text(r)];
  const out = (v && v.length ? v : ['']).map(x=> (x===''||x==null) ? '(비어 있음)' : String(x));
  return out;
}
function cellText(c, r){
  const raw = (c.values ? c.values(r) : [c.text(r)]).filter(x=> x!=='' && x!=null);
  return raw.length ? escapeHtml(raw.join(', ')) : '<span class="muted">-</span>';
}
function passOthers(key, cols, r, exceptKey){
  const st = tState(key);
  return cols.every(c=> c.key===exceptKey || !st.filters[c.key] || colValues(c,r).some(v=>st.filters[c.key].has(v)));
}
function applyTable(key, cols, rows, defaultSort){
  const st = tState(key);
  let out = rows.filter(r=> passOthers(key, cols, r, null));
  const sort = st.sort ? { c: cols.find(x=>x.key===st.sort.col), dir: st.sort.dir } : null;
  if(sort && sort.c){
    const sv = sort.c.sort || (r=>colValues(sort.c,r)[0]);
    out = out.slice().sort((a,b)=>{
      const x = sv(a), y = sv(b);
      const d = (typeof x==='number' && typeof y==='number') ? x-y : String(x).localeCompare(String(y),'ko',{numeric:true});
      return sort.dir==='desc' ? -d : d;
    });
  } else if(defaultSort){ out = out.slice().sort(defaultSort); }
  return out;
}
function dataTableHtml(key, cols, rows, opts){
  tableCtx[key] = { cols, rows, rerender: opts.rerender };
  const st = tState(key);
  const shown = applyTable(key, cols, rows, opts.defaultSort);
  const nFilters = Object.keys(st.filters).length;
  const head = cols.map(c=>{
    if(c.filter===false) return `<th>${c.label}</th>`;
    const sorted = st.sort && st.sort.col===c.key;
    const on = st.filters[c.key] || sorted;
    return `<th><button type="button" class="th-filter ${on?'on':''}" onclick="openColFilter(event,'${key}','${c.key}')">${c.label}<span class="th-caret">${sorted ? (st.sort.dir==='asc'?'▲':'▼') : (st.filters[c.key]?'⏷':'▾')}</span></button></th>`;
  }).join('');
  const body = shown.map(r=> opts.row(r, cols.map(c=>`<td${c.stop?' onclick="event.stopPropagation()"':''}${c.tdClass?` class="${c.tdClass}"`:''}>${c.html ? c.html(r) : cellText(c,r)}</td>`).join(''))).join('');
  return `${nFilters ? `<div class="filter-note">필터 ${nFilters}개 적용 중 · ${shown.length} / ${rows.length}건 <button type="button" onclick="clearTableFilters('${key}')">모두 해제</button></div>` : ''}
    <div class="data-table-wrap"><table class="data-table"><thead><tr>${head}</tr></thead>
    <tbody>${body || `<tr><td colspan="${cols.length}" class="empty-table">${rows.length ? '필터 조건에 맞는 항목이 없어요.' : opts.empty}</td></tr>`}</tbody></table></div>`;
}
let cfDraft = null;
function closeColFilter(){ const el = document.getElementById('col-filter'); if(el) el.remove(); cfDraft = null; }
document.addEventListener('click', closeColFilter);
function openColFilter(ev, key, colKey){
  ev.stopPropagation();
  const wasSame = cfDraft && cfDraft.key===key && cfDraft.colKey===colKey;
  closeColFilter();
  if(wasSame) return;
  const ctx = tableCtx[key], c = ctx.cols.find(x=>x.key===colKey), st = tState(key);
  const counts = new Map();
  ctx.rows.filter(r=>passOthers(key, ctx.cols, r, colKey))
    .forEach(r=> new Set(colValues(c,r)).forEach(v=> counts.set(v,(counts.get(v)||0)+1)));
  if(st.filters[colKey]) st.filters[colKey].forEach(v=>{ if(!counts.has(v)) counts.set(v,0); });
  const vals = Array.from(counts.keys()).sort(c.valueSort || ((a,b)=>a.localeCompare(b,'ko',{numeric:true})));
  const cur = st.filters[colKey];
  cfDraft = { key, colKey, vals, counts, checked: new Set(cur ? vals.filter(v=>cur.has(v)) : vals), visible: vals };
  const el = document.createElement('div');
  el.id = 'col-filter'; el.className = 'col-filter';
  el.onclick = e=> e.stopPropagation();
  el.innerHTML = `
    <div class="cf-sort">
      <button type="button" onclick="setTableSort('asc')">↑ 오름차순 정렬</button>
      <button type="button" onclick="setTableSort('desc')">↓ 내림차순 정렬</button>
    </div>
    <input type="search" class="cf-search" placeholder="값 검색" oninput="drawCfList(this.value)">
    <div class="cf-list" id="cf-list"></div>
    <div class="cf-actions">
      <button type="button" class="btn-ghost" onclick="clearColFilter()">필터 해제</button>
      <button type="button" class="btn-primary" onclick="applyColFilter()">확인</button>
    </div>`;
  document.body.appendChild(el);
  const b = ev.currentTarget.getBoundingClientRect();
  el.style.top = (b.bottom + window.scrollY + 6) + 'px';
  el.style.left = Math.max(8, Math.min(b.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - el.offsetWidth - 8)) + 'px';
  drawCfList('');
  el.querySelector('.cf-search').focus();
}
function drawCfList(q){
  const d = cfDraft; if(!d) return;
  const ql = q.trim().toLowerCase();
  d.visible = d.vals.filter(v=> !ql || v.toLowerCase().includes(ql));
  const allOn = d.visible.length && d.visible.every(v=>d.checked.has(v));
  document.getElementById('cf-list').innerHTML = d.visible.length
    ? `<label class="cf-item cf-all"><input type="checkbox" ${allOn?'checked':''} onchange="toggleCfAll(this.checked)"><span>(모두 선택)</span></label>`
      + d.visible.map(v=>{ const i = d.vals.indexOf(v); return `<label class="cf-item"><input type="checkbox" ${d.checked.has(v)?'checked':''} onchange="toggleCf(${i},this.checked)"><span>${escapeHtml(v)}</span><small>${d.counts.get(v)}</small></label>`; }).join('')
    : `<div class="cf-empty">일치하는 값이 없어요</div>`;
}
function toggleCf(i, on){ const v = cfDraft.vals[i]; on ? cfDraft.checked.add(v) : cfDraft.checked.delete(v); drawCfList(document.querySelector('.cf-search').value); }
function toggleCfAll(on){ cfDraft.visible.forEach(v=> on ? cfDraft.checked.add(v) : cfDraft.checked.delete(v)); drawCfList(document.querySelector('.cf-search').value); }
function applyColFilter(){
  const d = cfDraft, st = tState(d.key);
  if(d.vals.every(v=>d.checked.has(v))) delete st.filters[d.colKey];
  else st.filters[d.colKey] = new Set(d.checked);
  const k = d.key; closeColFilter(); tableCtx[k].rerender();
}
function clearColFilter(){ const d = cfDraft, st = tState(d.key); delete st.filters[d.colKey]; if(st.sort && st.sort.col===d.colKey) st.sort = null; const k = d.key; closeColFilter(); tableCtx[k].rerender(); }
function setTableSort(dir){ const d = cfDraft; tState(d.key).sort = { col: d.colKey, dir }; const k = d.key; closeColFilter(); tableCtx[k].rerender(); }
function clearTableFilters(key){ tState(key).filters = {}; tState(key).sort = null; tableCtx[key].rerender(); }

const catSortIdx = (label)=> { const i = ALL_CATS.findIndex(k=>CATEGORIES[k].label===label); return i<0 ? 99 : i; };
const catValueSort = (a,b)=> catSortIdx(a)-catSortIdx(b);
function shortOne(a, b){
  const f = iso=>{ const [y,m,d]=iso.split('-'); return `${y}.${m}.${d}`; };
  if(a===b) return f(a);
  const [y1,m1] = a.split('-'), [y2,m2,d2] = b.split('-');
  return `${f(a)}~${y1===y2 ? (m1===m2 ? d2 : `${m2}.${d2}`) : f(b)}`;
}
function shortRange(s){
  if(s.category && isRelease(s.category)) return shortOne(s.startDate, s.startDate) + (s.time ? ' ' + s.time : '');
  if(!s.category) return shortOne(s.startDate, s.endDate);
  return rangesOf(s).map(r=>shortOne(r.start, r.end)).join(', ');
}

/* =========================================================
   일정 관리: 오늘 / 월별 보기
========================================================= */
let schedView = 'today';
const ymOf = iso => iso.slice(0,7);
function monthsBetween(a, b){
  const out = []; let [y,m] = a.split('-').map(Number); const [y2,m2] = b.split('-').map(Number);
  while(y<y2 || (y===y2 && m<=m2)){ out.push(`${y}-${String(m).padStart(2,'0')}`); m++; if(m>12){ m=1; y++; } }
  return out;
}
function overlaps(s, from, to){ return overlapsAny(s, from, to); }
function schedulesInMonth(ym){ return scheduleCache.filter(s=> overlaps(s, ym+'-01', ym+'-31')); }
function scheduleMonths(){
  const cur = ymOf(todayISO());
  if(!scheduleCache.length) return [{ ym:cur, n:0 }];
  let min = cur, max = cur;
  scheduleCache.forEach(s=>{ if(ymOf(s.startDate)<min) min = ymOf(s.startDate); if(ymOf(s.endDate)>max) max = ymOf(s.endDate); });
  return monthsBetween(min, max).map(ym=>({ ym, n: schedulesInMonth(ym).length }));
}
function todayISO(){ return fmtDateISO(new Date()); }
function viewRows(){
  if(schedView==='today'){ const t = todayISO(); return scheduleCache.filter(s=>overlaps(s,t,t)); }
  if(schedView==='all') return scheduleCache.slice();
  return schedulesInMonth(schedView);
}
function stepMonth(dir){
  const months = scheduleMonths().filter(x=>x.n>0).map(x=>x.ym);
  if(!months.length) return;
  const base = (schedView==='today' || schedView==='all') ? ymOf(todayISO()) : schedView;
  const next = dir>0 ? months.find(m=>m>base) : months.slice().reverse().find(m=>m<base);
  if(next){ schedView = next; renderBody(); } else showToast(dir>0 ? '다음 일정이 있는 달이 없어요.' : '이전 일정이 있는 달이 없어요.');
}

/* =========================================================
   카테고리별 일정 양식
   - 발매(정규·EP·싱글·컴필레이션·믹스테입): 발매일 하루 + (선택) 시간
   - 콘서트: 일정 여러 개, 일정마다 공연일 하루 또는 기간(시작일·종료일)
   - 피지컬: 시작일·종료일 한 쌍
========================================================= */
const RELEASE_CATS = ['regular','ep','single','mixtape','compilation'];
const isRelease = c => RELEASE_CATS.includes(c);
function rangesOf(s){ return (s.ranges && s.ranges.length) ? s.ranges : [{ start:s.startDate, end:s.endDate }]; }
function overlapsAny(s, from, to){ return rangesOf(s).some(r=> r.start<=to && r.end>=from); }
function nextRangeOf(s){ const t = fmtDateISO(new Date()); const rs = rangesOf(s); return rs.find(r=>r.end>=t) || rs[rs.length-1]; }
function fmtRangeCompact(a, b, withYear){
  const [y1,m1,d1] = a.split('-').map(Number), [y2,m2,d2] = b.split('-').map(Number);
  const first = withYear ? `${y1}년 ${m1}월 ${d1}일` : `${m1}월 ${d1}일`;
  if(a===b) return first;
  if(y1===y2 && m1===m2) return `${first} ~ ${d2}일`;
  if(y1===y2) return `${first} ~ ${m2}월 ${d2}일`;
  return `${first} ~ ${y2}년 ${m2}월 ${d2}일`;
}
function fmtWhenKR(s){
  if(isRelease(s.category)) return fmtDateKR(s.startDate) + (s.time ? ' ' + s.time : '');
  let prevY = null;
  return rangesOf(s).map(r=>{ const y = r.start.slice(0,4); const t = fmtRangeCompact(r.start, r.end, y!==prevY); prevY = y; return t; }).join(', ');
}

let rangeSeq = 0;
function dateFieldHtml(id, label, iso){
  const [y,m,d] = (iso||'').split('-');
  const inp = (cls, len, ph, v, suf)=>`<input class="${cls}" type="text" inputmode="numeric" maxlength="${len}" placeholder="${ph}" id="${id}-${suf}" value="${v||''}" autocomplete="off">`;
  return `<div class="field" id="${id}-wrap"><label id="${id}-label">${label}</label><div class="date-group">${inp('y',4,'YYYY',y,'y')}${inp('m',2,'MM',m,'m')}${inp('d',2,'DD',d,'d')}</div>
    <div class="date-group-label"><span>년</span><span>월</span><span>일</span></div></div>`;
}
function rangeBlockHtml(p, i, r, multi){
  const rid = `${p}-g${rangeSeq++}`;
  if(multi){
    // 콘서트: 기본은 공연일 하루, '기간으로 설정'을 체크하면 시작일·종료일
    const isPeriod = !!(r.start && r.end && r.start !== r.end);
    return `<div class="range-block" data-rid="${rid}">
      <div class="range-head"><b>일정 ${i+1}</b>${i>0 ? `<button type="button" class="range-remove" onclick="removeRangeBlock(this)" title="빼기">✕</button>` : ''}</div>
      ${dateFieldHtml(rid+'-s', isPeriod ? '시작일' : '공연일', r.start)}
      <div id="${rid}-e-box" style="${isPeriod ? '' : 'display:none'}">${dateFieldHtml(rid+'-e', '종료일', r.end || r.start)}</div>
      <label class="when-check"><input type="checkbox" id="${rid}-period" ${isPeriod ? 'checked' : ''} onchange="togglePeriod('${rid}')">기간으로 설정</label>
    </div>`;
  }
  return `<div class="range-block" data-rid="${rid}">
    ${dateFieldHtml(rid+'-s', '시작일', r.start)}${dateFieldHtml(rid+'-e', '종료일', r.end)}
  </div>`;
}
function isPeriodBlock(rid){ const cb = document.getElementById(rid+'-period'); return !cb || cb.checked; }
function togglePeriod(rid){
  const on = isPeriodBlock(rid);
  document.getElementById(rid+'-e-box').style.display = on ? '' : 'none';
  document.getElementById(rid+'-s-label').textContent = on ? '시작일' : '공연일';
  // 하루 → 기간: 종료일이 비어 있으면 공연일로 채움 / 기간 → 하루: 공연일 칸에는 시작일이 그대로 남음
  if(on && !document.getElementById(rid+'-e-y').value){
    ['y','m','d'].forEach(q=>{ document.getElementById(`${rid}-e-${q}`).value = document.getElementById(`${rid}-s-${q}`).value; });
  }
}
function toggleTime(p){
  const on = document.getElementById(p+'-time-on').checked;
  document.getElementById(p+'-time-wrap').style.display = on ? '' : 'none';
  if(on) document.getElementById(p+'-hh').focus();
}
function whenSectionHtml(p, cat, v){
  v = v || {};
  if(isRelease(cat)){
    const [hh, mm] = (v.time||'').split(':');
    const hasTime = !!v.time;
    return `${dateFieldHtml(p+'-rd', '발매일', v.startDate)}
      <label class="when-check"><input type="checkbox" id="${p}-time-on" ${hasTime ? 'checked' : ''} onchange="toggleTime('${p}')">시간 입력</label>
      <div class="field" id="${p}-time-wrap" style="${hasTime ? '' : 'display:none'}"><label>시간</label><div class="time-group">
        <input id="${p}-hh" type="text" inputmode="numeric" maxlength="2" placeholder="HH" value="${hh||''}" autocomplete="off"><span>:</span>
        <input id="${p}-mm" type="text" inputmode="numeric" maxlength="2" placeholder="MM" value="${mm||''}" autocomplete="off">
      </div></div>`;
  }
  const rs = (cat==='concert' && v.ranges && v.ranges.length) ? v.ranges : [{ start:v.startDate||'', end:v.endDate||'' }];
  if(cat==='concert'){
    return `<div class="range-list" id="${p}-ranges">${rs.map((r,i)=>rangeBlockHtml(p, i, r, true)).join('')}
      <button type="button" class="artist-add" onclick="addRangeBlock('${p}')">+ 일정 추가</button></div>`;
  }
  return rangeBlockHtml(p, 0, rs[0], false);
}
function bindPair(rid){
  const parts = ['y','m','d'], lim = { y:[4,null], m:[2,12], d:[2,31] };
  parts.forEach(k=>{ ['s','e'].forEach(se=>{ const el = document.getElementById(`${rid}-${se}-${k}`); if(el && !el.dataset.bound){ clampDigits(el, lim[k][0], lim[k][1]); el.dataset.bound = '1'; } }); });
  parts.forEach(k=>{
    const s = document.getElementById(`${rid}-s-${k}`);
    if(s && !s.dataset.copy){ s.dataset.copy = '1'; s.addEventListener('input', ()=>{ parts.forEach(q=>{ document.getElementById(`${rid}-e-${q}`).value = document.getElementById(`${rid}-s-${q}`).value; }); }); }
  });
}
function bindWhenSection(p){
  const box = document.getElementById(p+'-when'); if(!box) return;
  box.querySelectorAll('.range-block').forEach(b=> bindPair(b.dataset.rid));
  const rd = { y:[4,null], m:[2,12], d:[2,31] };
  Object.keys(rd).forEach(k=>{ const el = document.getElementById(`${p}-rd-${k}`); if(el && !el.dataset.bound){ clampDigits(el, rd[k][0], rd[k][1]); el.dataset.bound='1'; } });
  [['hh',23],['mm',59]].forEach(([k,max])=>{ const el = document.getElementById(`${p}-${k}`); if(el && !el.dataset.bound){ clampDigits(el, 2, max); el.dataset.bound='1'; } });
}
function addRangeBlock(p){
  const list = document.getElementById(p+'-ranges');
  const n = list.querySelectorAll('.range-block').length;
  list.querySelector('.artist-add').insertAdjacentHTML('beforebegin', rangeBlockHtml(p, n, {start:'',end:''}, true));
  const blocks = list.querySelectorAll('.range-block');
  const b = blocks[blocks.length-1]; bindPair(b.dataset.rid);
  document.getElementById(`${b.dataset.rid}-s-y`).focus();
}
function removeRangeBlock(btn){
  const list = btn.closest('.range-list');
  btn.closest('.range-block').remove();
  list.querySelectorAll('.range-head b').forEach((el,i)=> el.textContent = `일정 ${i+1}`);
}
// 카테고리를 바꿀 때 이미 쓴 날짜를 최대한 옮기기 위해 오류 없이 읽기
function peekWhen(p, cat){
  if(isRelease(cat)){ const d = readDateGroup(p+'-rd'); const tOn = (document.getElementById(p+'-time-on')||{}).checked;
    const hh = tOn ? (document.getElementById(p+'-hh')||{}).value : '', mm = tOn ? (document.getElementById(p+'-mm')||{}).value : '';
    return { startDate:d||'', endDate:d||'', time: hh ? `${hh.padStart(2,'0')}:${(mm||'0').padStart(2,'0')}` : '' }; }
  const rs = Array.from(document.querySelectorAll(`#${p}-when .range-block`)).map(b=>{ const s = readDateGroup(b.dataset.rid+'-s')||''; return { start: s, end: isPeriodBlock(b.dataset.rid) ? (readDateGroup(b.dataset.rid+'-e')||'') : s }; }).filter(r=>r.start||r.end);
  return { startDate: rs[0] ? rs[0].start : '', endDate: rs[0] ? rs[0].end : '', ranges: rs };
}
function readWhen(p, cat){
  if(isRelease(cat)){
    const date = readDateGroup(p+'-rd');
    if(!date) return { error:'발매일을 올바르게 입력해주세요.' };
    const tOn = document.getElementById(p+'-time-on').checked;
    const hh = tOn ? document.getElementById(p+'-hh').value.trim() : '', mm = tOn ? document.getElementById(p+'-mm').value.trim() : '';
    if(!hh && mm) return { error:'시간의 시(HH)를 입력해주세요.' };
    return { date, time: hh ? `${hh.padStart(2,'0')}:${(mm||'0').padStart(2,'0')}` : '' };
  }
  const ranges = [];
  for(const b of document.querySelectorAll(`#${p}-when .range-block`)){
    const period = isPeriodBlock(b.dataset.rid);
    const s = readDateGroup(b.dataset.rid+'-s'), e = period ? readDateGroup(b.dataset.rid+'-e') : s;
    if(!s) return { error: period ? '시작일을 올바르게 입력해주세요.' : '공연일을 올바르게 입력해주세요.' };
    if(!e) return { error:'종료일을 올바르게 입력해주세요.' };
    if(e < s) return { error:'종료일이 시작일보다 빠를 수 없어요.' };
    ranges.push({ start:s, end:e });
  }
  if(cat==='concert') return { ranges };
  return { startDate: ranges[0].start, endDate: ranges[0].end };
}
function scheduleFormHtml(p, v){
  v = v || {};
  const cat = v.category || 'regular';
  return `<div id="${p}-when" class="when-box">${whenSectionHtml(p, cat, v)}</div>
    ${artistFieldsHtml(p, v.artists || [])}
    <div class="field"><label>카테고리</label><select id="${p}-category">${ALL_CATS.map(k=>`<option value="${k}" ${cat===k?'selected':''}>${CATEGORIES[k].label}</option>`).join('')}</select></div>
    <div class="field"><label id="${p}-title-label">${isRelease(cat)?'앨범명':'일정'}</label><input type="text" id="${p}-title" value="${escapeHtml(v.title||'')}" autocomplete="off"></div>
    <div class="field" id="${p}-venue-wrap" style="${cat==='concert'?'':'display:none'}"><label>공연장</label><input type="text" id="${p}-venue" value="${escapeHtml(v.venue||'')}" autocomplete="off"></div>
    <div class="field"><label>비고</label><textarea id="${p}-note">${escapeHtml(v.note||'')}</textarea></div>`;
}
function bindScheduleForm(p){
  bindWhenSection(p);
  const sel = document.getElementById(p+'-category');
  sel.dataset.prev = sel.value;
  sel.onchange = ()=>{
    const prev = sel.dataset.prev, cat = sel.value;
    const v = peekWhen(p, prev);
    document.getElementById(p+'-when').innerHTML = whenSectionHtml(p, cat, v);
    bindWhenSection(p);
    document.getElementById(p+'-title-label').textContent = isRelease(cat) ? '앨범명' : '일정';
    document.getElementById(p+'-venue-wrap').style.display = cat==='concert' ? '' : 'none';
    sel.dataset.prev = cat;
  };
}
function readScheduleForm(p){
  const category = document.getElementById(p+'-category').value;
  const when = readWhen(p, category);
  if(when.error) return { error: when.error };
  const artists = readArtistFields(p);
  if(!artists.length) return { error:'아티스트를 1명 이상 입력해주세요.' };
  const title = document.getElementById(p+'-title').value.trim();
  if(!title) return { error: isRelease(category) ? '앨범명을 입력해주세요.' : '일정을 입력해주세요.' };
  const venue = category==='concert' ? document.getElementById(p+'-venue').value.trim() : '';
  const note = document.getElementById(p+'-note').value.trim();
  return { data: { category, ...when, artists, title, venue, note } };
}

/* ---- 로그인 상태 (오른쪽 위) ---- */
async function renderAuthArea(){
  const area = document.getElementById('auth-area');
  let user = null;
  try{ user = (await apiCall('resource=auth')).user; }catch(e){}
  if(user){
    const pic = `<span class="avatar">${escapeHtml(Array.from(user.name||user.email||'?')[0].toUpperCase())}</span>`;
    area.innerHTML = `<div class="user-chip">${pic}<span class="name">${escapeHtml(user.name||user.email)}</span>
      <button class="logout-btn" onclick="adminLogout()">로그아웃</button></div>`;
  } else {
    // 비상용 비밀번호로 들어온 경우
    area.innerHTML = `<span class="pw-note">비밀번호로 접속 중</span>
      <a class="login-btn" href="/#/login?next=%2Fmanage">구글 로그인</a>`;
  }
}
async function adminLogout(){
  try{ await apiCall('resource=auth&action=logout', { method:'POST' }); }catch(e){}
  location.href = '/';
}

window.addEventListener('DOMContentLoaded', ()=>{ renderAuthArea(); render(); });
</script>
